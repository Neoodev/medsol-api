services:
  - type: web
    name: medsol-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: NODE_ENV
        sync: false
      - key: PORT
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: DATABASE_URL
        sync: false