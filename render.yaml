services:
  - type: web
    name: medsol-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build && npm run prisma:migrate:deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
       sync: false
      - key: PORT
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: DATABASE_URL
        sync: false